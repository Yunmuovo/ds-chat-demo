name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      # 首次运行生成固定签名密钥并提交；之后所有版本共用，升级才能覆盖安装
      - name: Ensure stable signing key
        run: |
          if [ ! -f android/keystore.jks ]; then
            keytool -genkeypair -v -storetype PKCS12 -keystore android/keystore.jks \
              -alias dschat -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass dschat2024 -keypass dschat2024 \
              -dname "CN=DeepSeek Chat Demo, OU=Yunmuovo, O=Yunmuovo, C=CN"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add android/keystore.jks
            git commit -m "chore: 生成固定签名密钥 [skip ci]"
            git push origin HEAD:main
          else
            echo "已存在签名密钥，直接复用"
          fi

      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ds-chat-demo-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish release with APK
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
